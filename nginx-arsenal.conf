# okna-arsenal24.ru — только apex + www.
# Чужие домены (фишинг, mail.*, IP Host) закрываются default_server → 444.

# Catch-all HTTP: не отдаём сайт чужим Host / IP
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# Catch-all HTTPS: без валидного server_name nginx иначе берёт единственный
# SSL-виртуальный хост и проксирует Nuxt на чужие домены.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/default.crt;
    ssl_certificate_key /etc/nginx/ssl/default.key;
    ssl_reject_handshake on;

    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name okna-arsenal24.ru www.okna-arsenal24.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name okna-arsenal24.ru www.okna-arsenal24.ru;

    ssl_certificate /etc/letsencrypt/live/okna-arsenal24.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/okna-arsenal24.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Не отдаём чужой Host даже если запрос попал сюда
    if ($host !~* ^(okna-arsenal24\.ru|www\.okna-arsenal24\.ru)$) {
        return 444;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
